<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cravvnn profile header source</title>
<style>body{margin:0}canvas{display:block;width:100%;height:auto}</style>
<canvas id="header" width="1200" height="450" aria-label="Cravvnn — editor, producer, dev. cravvnn.link"></canvas>
<script>
const canvas = document.getElementById('header');
const ctx = canvas.getContext('2d');
const bg = [15, 15, 14];
const orange = [255, 79, 0];
const bayer = [0,48,12,60,3,51,15,63,32,16,44,28,35,19,47,31,8,56,4,52,11,59,7,55,40,24,36,20,43,27,39,23,2,50,14,62,1,49,13,61,34,18,46,30,33,17,45,29,10,58,6,54,9,57,5,53,42,26,38,22,41,25,37,21];
ctx.fillStyle = '#0f0f0e';
ctx.fillRect(0, 0, 1200, 450);
ctx.fillStyle = '#ecece8';
ctx.font = '24px Arial';
ctx.fillText('editor / producer / dev', 53, 61);
ctx.font = '600 240px Arial';
ctx.fillText('cravvnn', 38, 300);
const pixels = ctx.getImageData(0, 0, 1200, 450);
for (let y = 190; y < 340; y += 2) {
  for (let x = 36; x < 1165; x += 2) {
    const fade = Math.max(0, Math.min(1, (y - 205) / 117));
    const threshold = (bayer[((y / 2) % 8) * 8 + (x / 2) % 8] + .5) / 64;
    for (let dy = 0; dy < 2; dy++) {
      for (let dx = 0; dx < 2; dx++) {
        const i = ((y + dy) * 1200 + x + dx) * 4;
        if (pixels.data[i] < 30) continue;
        const color = fade > threshold ? (fade > .6 + threshold * .5 ? bg : orange) : null;
        if (color) for (let c = 0; c < 3; c++) pixels.data[i + c] = color[c];
      }
    }
  }
}
ctx.putImageData(pixels, 0, 0);
ctx.fillStyle = '#ecece8';
ctx.font = '24px Arial';
ctx.fillText('Cinematics, replays & creative collaboration.', 53, 402);
ctx.fillStyle = '#ff4f00';
ctx.font = '600 26px Arial';
ctx.textAlign = 'right';
ctx.fillText('cravvnn.link', 1147, 402);
</script>
</html>
